<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeInBlack Dialer</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* 60% Black, 30% Lime, 10% White */
        :root {
            --black: #0a0a0a;
            --black-surface: #141414;
            --lime: #39ff14;
            --lime-hover: #2ee610;
            --white: #ffffff;
            --white-muted: #cccccc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Space Grotesk', sans-serif;
        }

        body {
            background-color: var(--black);
            color: var(--white);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .column-layout {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            padding: 2rem;
            animation: fadeIn 0.8s ease-out;
        }

        /* Banner */
        .banner {
            text-align: center;
            padding: 2rem 0;
            border-bottom: 2px solid var(--lime);
            margin-bottom: 2rem;
            box-shadow: 0 10px 30px -15px rgba(57, 255, 20, 0.3);
        }

        .banner h1 {
            color: var(--lime);
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .banner span {
            color: var(--white);
        }

        /* Forms & Inputs */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        input {
            width: 100%;
            padding: 1rem;
            background: var(--black-surface);
            border: 1px solid #333;
            color: var(--white);
            font-size: 1.1rem;
            border-radius: 8px;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: var(--lime);
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.2);
        }

        button {
            width: 100%;
            padding: 1rem;
            background: var(--lime);
            color: var(--black);
            border: none;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        button:hover {
            background: var(--lime-hover);
            box-shadow: 0 0 20px rgba(57, 255, 20, 0.4);
            transform: translateY(-2px);
        }

        /* Dashboard / Contact List */
        #dashboard {
            display: none;
            flex-direction: column;
            gap: 1.5rem;
            animation: slideUp 0.5s ease-out;
        }

        .user-greeting {
            font-size: 1.2rem;
            color: var(--white-muted);
            text-align: center;
            margin-bottom: 1rem;
        }

        .contact-card {
            background: var(--black-surface);
            padding: 1.5rem;
            border-radius: 12px;
            border-left: 4px solid var(--lime);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.3s ease;
        }

        .contact-card:hover {
            transform: translateX(5px);
        }

        .contact-info h3 {
            color: var(--white);
            margin-bottom: 0.5rem;
            font-size: 1.3rem;
        }

        .contact-info p {
            color: var(--lime);
            font-weight: 600;
        }

        .call-btn {
            background: transparent;
            border: 2px solid var(--lime);
            color: var(--lime);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .call-btn:hover {
            background: var(--lime);
            color: var(--black);
            box-shadow: 0 0 15px var(--lime);
        }

        .call-btn svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        /* Toast Notifications */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--lime);
            color: var(--black);
            padding: 1rem 2rem;
            border-radius: 50px;
            font-weight: 600;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
            visibility: visible;
            bottom: 40px;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="column-layout">
        <div class="banner">
            <h1>CodeInBlack <span>Dialer</span></h1>
        </div>

        <!-- Login Section -->
        <div id="login-section" class="input-group">
            <input type="text" id="username" placeholder="Enter Username..." autocomplete="off">
            <button onclick="login()">Access Portal</button>
        </div>

        <!-- Dashboard Section -->
        <div id="dashboard">
            <div class="user-greeting" id="greeting"></div>
            <div id="contact-list">
                <!-- Contacts injected here -->
            </div>
            <button onclick="logout()" style="background: transparent; border: 1px solid var(--white); color: var(--white); margin-top: 2rem;">Log Out</button>
        </div>
    </div>

    <div id="toast" class="toast">Message</div>

    <script>
        // ==========================================
        // INITIALIZE SUPABASE
        // ==========================================
        const SUPABASE_URL = 'https://axqwbtqhmfzxiewateyf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF4cXdidHFobWZ6eGlld2F0ZXlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyMjA2NDUsImV4cCI6MjEwMjc5NjY0NX0.Clwzf8Cc13dg1cE9xNcPOkt3GTUJdVYf3cMQWT05vWE';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Toast Notification
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // Login Logic
        async function login() {
            const rawUsername = document.getElementById('username').value.trim();
            if (!rawUsername) return showToast('Please enter a username');
            
            // Case insensitive formatting
            const username = rawUsername.toLowerCase();

            try {
                // Check if user exists
                const { data: user, error } = await supabase
                    .from('users')
                    .select('*')
                    .eq('username', username)
                    .single();

                if (error || !user) {
                    showToast('User not found in system.');
                    return;
                }

                showToast('Authentication Successful');
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('dashboard').style.display = 'flex';
                document.getElementById('greeting').innerText = `Welcome, ${user.username}`;
                
                loadContacts(user.id);
            } catch (err) {
                showToast('Connection Error');
            }
        }

        // Load Contacts Logic
        async function loadContacts(userId) {
            const { data: contacts, error } = await supabase
                .from('contacts')
                .select('*')
                .eq('user_id', userId);

            if (error) return showToast('Failed to load contacts');

            const list = document.getElementById('contact-list');
            list.innerHTML = ''; // Clear existing

            if (contacts.length === 0) {
                list.innerHTML = '<p style="text-align:center; color:var(--white-muted);">No assigned numbers found.</p>';
                return;
            }

            contacts.forEach((contact, index) => {
                // Staggered animation delay
                const delay = index * 0.1;
                
                const card = document.createElement('div');
                card.className = 'contact-card';
                card.style.animation = `slideUp 0.5s ease-out ${delay}s forwards`;
                card.style.opacity = '0'; // For animation

                card.innerHTML = `
                    <div class="contact-info">
                        <h3>${contact.business_name}</h3>
                        <p>${contact.phone_number}</p>
                    </div>
                    <a href="tel:${contact.phone_number}" class="call-btn" title="Call ${contact.business_name}">
                        <svg viewBox="0 0 24 24">
                            <path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56a.977.977 0 00-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.11-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.01 21c.71 0 .99-.63.99-1.18v-3.45c0-.54-.45-.99-.99-.99z"/>
                        </svg>
                    </a>
                `;
                list.appendChild(card);
            });
        }

        // Logout Logic
        function logout() {
            document.getElementById('username').value = '';
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('login-section').style.display = 'flex';
            document.getElementById('contact-list').innerHTML = '';
        }
    </script>
</body>
</html>
